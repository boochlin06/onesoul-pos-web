name: Admin ERP Build CI

on:
  push:
    branches: [main, dev, 'feature/**']
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Admin ERP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install Admin Dependencies
        working-directory: admin
        run: npm ci || npm install

      - name: Audit Dependencies (Security Warning)
        working-directory: admin
        run: npm audit --audit-level=high || echo "::warning::Audit advisories noted"

      - name: TypeScript Build & Vite Packaging
        working-directory: admin
        run: npm run build
