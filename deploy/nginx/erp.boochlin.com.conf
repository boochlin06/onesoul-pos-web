# ─────────────────────────────────────────────────────────────
# OneSoul ERP / POS 旗艦系統 - 宿主機 Nginx 反向代理設定
# 檔案位置建議放在宿主機：/etc/nginx/sites-available/erp.boochlin.com
# 啟用軟連結：sudo ln -s /etc/nginx/sites-available/erp.boochlin.com /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name erp.boochlin.com;

    # 客戶端最大上傳限制 (供報表匯入與商品圖片上傳)
    client_max_body_size 50M;

    # ── 1. 前端 Admin SPA 靜態託管轉發 (轉給 Docker 8080) ──
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 靜態資源連線最佳化
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── 2. 後端 Fastify RESTful API 與 SSE 即時推播 (轉給 Docker 3000) ──
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 支援 WebSocket / HTTP 升級協定
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚡ SSE (Server-Sent Events) 與長輪詢必備防斷線配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 3. 系統健康檢查端點 ──
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
