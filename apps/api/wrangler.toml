name = "onesoul-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── 1. 單一 D1 實體 SQLite 資料庫 (邏輯多租戶架構 - $0 架構) ──
[[d1_databases]]
binding = "DB"
database_name = "onesoul-d1-prod"
database_id = "onesoul-d1-prod-local-id"
migrations_dir = "../../packages/db/drizzle/migrations"

# ── 2. Cloudflare KV 快取與門市組態 ──
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "onesoul-config-kv-local-id"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "onesoul-session-kv-local-id"

# ── 3. Cloudflare R2 靜態資產與大賞圖檔 ──
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "onesoul-assets"

# ── 4. 定時排程觸發器 ($0 月費取代 Queues) ──
[triggers]
crons = ["30 14 * * *", "0 15 * * *"] # 台北時間 22:30 催關帳, 23:00 總部 Z-Report

[vars]
ENVIRONMENT = "development"
DEFAULT_STORE_ID = "chupei"
ALLOWED_ORIGINS = "https://pos.onesoul.tw,https://admin.onesoul.tw"
CF_ACCESS_TEAM_NAME = "onesoul"
CF_ACCESS_AUD = "onesoul-access-aud-placeholder"
